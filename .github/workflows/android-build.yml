name: Android Build & Sign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Hardening:
    # - Secrets TIDAK diekspos sebagai env level job (hanya step yang
    #   benar-benar memakainya) agar tidak bisa dibaca action pihak ketiga.
    # - Semua action di-pin ke commit SHA (anti supply-chain).
    # - Job punya batas waktu agar tidak menggantung habis quota runner.
    timeout-minutes: 90
    steps:
      - name: Checkout kode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Jalankan unit test seluruh module
        run: ./gradlew test

      - name: Build APK Debug
        run: ./gradlew assembleDebug

      - name: Upload APK Debug sebagai artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mochits-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore dari GitHub Secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mochits-release.jks"

      - name: Build APK Release (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PMOCHITS_STORE_FILE="$RUNNER_TEMP/mochits-release.jks" \
            -PMOCHITS_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMOCHITS_KEY_ALIAS="$KEY_ALIAS" \
            -PMOCHITS_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK Release sebagai artifact
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mochits-release
          path: app/build/outputs/apk/release/*.apk

      - name: Hapus file keystore sementara
        if: ${{ always() && secrets.KEYSTORE_BASE64 != '' }}
        run: rm -f "$RUNNER_TEMP/mochits-release.jks"
