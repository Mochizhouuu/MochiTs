name: Android Build & Sign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Jalankan unit test seluruh module
        run: ./gradlew test

      - name: Build APK Debug
        run: ./gradlew assembleDebug

      - name: Upload APK Debug sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochits-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore dari GitHub Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mochits-release.jks"

      - name: Build APK Release (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew assembleRelease \
            -PMOCHITS_STORE_FILE="$RUNNER_TEMP/mochits-release.jks" \
            -PMOCHITS_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMOCHITS_KEY_ALIAS="$KEY_ALIAS" \
            -PMOCHITS_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK Release sebagai artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mochits-release
          path: app/build/outputs/apk/release/*.apk

      - name: Hapus file keystore sementara
        if: always() && env.KEYSTORE_BASE64 != ''
        run: rm -f "$RUNNER_TEMP/mochits-release.jks"
