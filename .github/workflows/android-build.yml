name: Android Build & Sign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OPENCV_VERSION: "4.9.0"
      OPENCV_SHA256: "d181481fdabf6c02b1b45a3b382a583c531bb4d6b0582d0fbbb686487f071218"
    timeout-minutes: 90
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5 # v5.1.0 - Node 24

      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: third_party/opencv
          key: opencv-android-sdk-${{ env.OPENCV_VERSION }}

      - name: Download & Verify OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          cd third_party
          echo "Downloading OpenCV Android SDK v${OPENCV_VERSION}..."
          curl -sL "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" -o opencv.zip
          echo "${OPENCV_SHA256}  opencv.zip" | sha256sum -c -
          echo "Unpacking OpenCV Android SDK..."
          unzip -q opencv.zip
          mv OpenCV-android-sdk opencv
          rm -rf opencv/samples opencv/doc opencv.zip

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5 # v5 - Node 24, hindari v6 kalau tidak mau license caching baru

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Jalankan unit test seluruh module
        run: ./gradlew test

      - name: Upload laporan unit test saat gagal
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            core-imaging/build/reports/tests/
            core-imaging/build/test-results/

      - name: Build APK Debug
        run: ./gradlew assembleDebug

      - name: Upload APK Debug sebagai artifact
        uses: actions/upload-artifact@v6 # v6.0.0 - pertama yang default Node 24
        with:
          name: mochits-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore dari GitHub Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mochits-release.jks"

      - name: Build APK Release (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew assembleRelease \
            -PMOCHITS_STORE_FILE="$RUNNER_TEMP/mochits-release.jks" \
            -PMOCHITS_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMOCHITS_KEY_ALIAS="$KEY_ALIAS" \
            -PMOCHITS_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK Release sebagai artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v6 # v6.0.0 - pertama yang default Node 24
        with:
          name: mochits-release
          path: app/build/outputs/apk/release/*.apk

      - name: Hapus file keystore sementara
        if: ${{ always() && env.KEYSTORE_BASE64 != '' }}
        run: rm -f "$RUNNER_TEMP/mochits-release.jks"
