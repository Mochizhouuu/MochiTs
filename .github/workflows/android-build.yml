name: Android Build & Sign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OPENCV_VERSION: "4.9.0"
      OPENCV_SHA256: "d181481fdabf6c02b1b45a3b382a583c531bb4d6b0582d0fbbb686487f071218"
    timeout-minutes: 90
    steps:
      - name: Checkout kode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: third_party/opencv
          key: opencv-android-sdk-${{ env.OPENCV_VERSION }}

      - name: Download & Verify OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          cd third_party
          echo "Downloading OpenCV Android SDK v${OPENCV_VERSION}..."
          curl -sL "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" -o opencv.zip
          echo "${OPENCV_SHA256}  opencv.zip" | sha256sum -c -
          echo "Unpacking OpenCV Android SDK..."
          unzip -q opencv.zip
          mv OpenCV-android-sdk opencv
          rm opencv.zip

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Jalankan unit test seluruh module
        run: ./gradlew test

      - name: Build APK Debug
        run: ./gradlew assembleDebug

      - name: Upload APK Debug sebagai artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mochits-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore dari GitHub Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mochits-release.jks"

      - name: Build APK Release (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew assembleRelease \
            -PMOCHITS_STORE_FILE="$RUNNER_TEMP/mochits-release.jks" \
            -PMOCHITS_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMOCHITS_KEY_ALIAS="$KEY_ALIAS" \
            -PMOCHITS_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK Release sebagai artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mochits-release
          path: app/build/outputs/apk/release/*.apk

      - name: Hapus file keystore sementara
        if: ${{ always() && env.KEYSTORE_BASE64 != '' }}
        run: rm -f "$RUNNER_TEMP/mochits-release.jks"
